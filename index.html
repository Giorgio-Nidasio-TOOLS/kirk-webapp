<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Comandante Kirk a Enterprise</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <!--
    Kirk dal 30/08/2026: SOLO il Deposito.
    La chat e' stata dismessa (il canale sincrono lo fa Remote Control).
    Superato il saluto (gate biometrico + voce), il Deposito e' gia' qui:
    niente pulsanti da cercare, niente pannelli da aprire.
  -->
  <header>
    <img id="logo" src="./kirk-avatar.jpg" alt="" onerror="this.style.display='none'">
    <span id="app-name">Comandante Kirk</span>
    <span id="dep-contatore" class="hidden" title="Depositi non ancora arrivati al PC"></span>
    <div class="header-btns">
      <button id="notif-btn" title="Abilita notifiche push" style="display:none">🔔</button>
      <button id="mute-btn" title="Audio del saluto">🔊</button>
      <button id="settings-btn" title="Impostazioni">⚙️</button>
    </div>
  </header>

  <main id="main">
    <!-- DEPOSITO: foto + voce + testo in un pacchetto solo.
         Contiene l'UNICO microfono dell'app: prima ce n'erano due, identici,
         in punti diversi, con destini opposti. -->
    <section id="dep-panel" class="dep">
      <h2>📥 Deposita</h2>
      <p class="dep-hint">Foto, voce e appunti insieme. Parte da sola appena c'è rete.</p>

      <div id="dep-galleria" class="dep-galleria"></div>
      <input id="dep-foto-input" type="file" accept="image/*" capture="environment" multiple hidden>

      <div class="dep-actions">
        <button id="dep-foto-btn">📷 Foto</button>
        <button id="dep-mic-btn">🎤 Registra</button>
      </div>
      <div id="dep-audio-info" class="dep-audio-info"></div>

      <textarea id="dep-testo" rows="3"
        placeholder="Appunti, richieste, link LinkedIn, mail dettata... (facoltativo)"></textarea>

      <!-- ALLEGATI: due pulsanti, due selettori PULITI (01/09/2026).
           Un solo input senza `accept` faceva comparire lo "Scegli un'azione"
           di Samsung con fotocamere e un ambiguo "Foto e video": dichiarando i
           tipi, Android apre direttamente il selettore giusto.
           🖼 accept="image/*"  -> selettore immagini (galleria, anche cloud); diventano FOTO
           📎 accept=documenti  -> selettore file (Recenti, Download, OneDrive); restano com'e' -->
      <div id="dep-allegati" class="dep-allegati"></div>
      <input id="dep-img-input" type="file" accept="image/*" multiple hidden>
      <input id="dep-file-input" type="file" multiple hidden
        accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.csv,.md,.rtf,.odt,.ods,.odp,.zip,.7z,.eml,.msg,.json,.xml,.html">
      <div class="dep-allega-row">
        <button id="dep-immagini-btn" class="dep-allega">🖼 Immagini</button>
        <button id="dep-allega-btn" class="dep-allega">📎 Documenti</button>
      </div>

      <button id="dep-invia-btn" class="dep-invia">Deposita</button>
      <div id="dep-stato"></div>
    </section>

    <!-- REGISTRO: gli ultimi depositi, con l'esito DERIVATO dalla coda
         (in coda = non ancora arrivato al PC; consegnato = il server ha risposto 200). -->
    <section id="dep-registro" class="registro">
      <h3>Ultimi depositi</h3>
      <ul id="dep-lista"></ul>
      <p id="dep-lista-vuota" class="registro-vuoto">Nessun deposito su questo telefono.</p>
    </section>
  </main>

  <div id="status" class="warning">Configura URL e token in ⚙️</div>

  <!-- Biometric gate: visibile di default, nascosto dopo verifica impronta -->
  <div id="biometric-gate">
    <div class="bio-card">
      <div class="bio-icon">🔐</div>
      <div class="bio-title">Comandante Kirk</div>
      <div class="bio-msg" id="bio-msg">Verifica la tua identità per accedere</div>
      <button id="bio-btn">Usa impronta digitale</button>
    </div>
  </div>

  <div id="settings-panel" class="panel hidden">
    <h3>Impostazioni Kirk</h3>
    <label>URL Server (tunnel ngrok)
      <input id="server-url" type="url" placeholder="https://....ngrok-free.dev">
    </label>
    <label>Token Segreto
      <input id="api-token" type="password" placeholder="token in config.json del backend">
    </label>
    <button id="save-settings">Salva e connetti</button>
    <button id="close-settings" class="secondary">Chiudi</button>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
